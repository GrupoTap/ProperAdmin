<!-- ═══════════════════════════════════════════════════════════════════════════
     MURAL DA OFICINA — build MURAL_V1 · 25/08/2026
     Arquivo servido em: GrupoTap/ProperAdmin/mural.html
     (arquivo NOVO no repo do PCM — NÃO encosta no index.html)

     O QUE É
     ───────
     A gestão à vista que existia no quadro físico e sumiu quando tudo virou
     mobile. Uma tela, sempre ligada, sem ninguém tocar nela.

     🔑 REGRAS DE DESENHO (todas pagas com lição registrada no CLAUDE.md)

     1. ZERO GAS NOVO. Duas actions de LEITURA que já existem no doGet do v119:
          getKanbanOficina   → cards, colunas, resumo, bloqueada, dias_na_oficina
          getItensNaOficina  → nome/série da máquina por ID (só isso)
        Nenhuma escrita. Nenhum campo novo. Nenhuma coluna nova.

     2. ZERO SEGUNDA VERDADE. A posição da fila (`posicao_fila`), a situação do
        semáforo (`situacao`) e o travamento (`bloqueada`) vêm PRONTOS do GAS.
        Esta página não recalcula NADA disso. Se o PCF diz "#3" e o mural
        dissesse "#5" para a mesma OS, o mural estaria errado por construção.

     3. A FAIXA DE TRAVADAS NUNCA CHUTA. Só entra card com `bloqueada === true`.
        GAS anterior ao v119 ⇒ a faixa simplesmente NÃO APARECE. Faixa vazia é
        melhor que faixa que adivinha (lição "alerta falso gasta o alerta").

     4. RÓTULO NUNCA MENTE. Sem `Custodia_Desde` a máquina não tem chegada
        registrada: o card diz "desde a abertura", com o número de
        `dias_na_fila` — nunca "na oficina" com número derivado.

     5. ZERO INTERAÇÃO E ZERO ROTAÇÃO. Não há botão, não há aba, a tela não
        gira. Estabilidade é o que ensina o olho onde olhar. Decisão do
        Fernando em 25/08: uma tela só, travadas na faixa de baixo.

     6. NÃO ROLA. Coluna que não cabe corta no fim e mostra "+N". Barra de
        rolagem em quadro de parede é informação que ninguém nunca vai ver.

     7. DEGRADAÇÃO HONESTA. Rede caiu ⇒ continua pintado o último quadro bom, e
        o carimbo do topo diz de que horas ele é (âmbar > 6 min, vermelho >
        15 min). Nunca tela em branco, nunca número velho fingindo ser de agora.

     8. SEM WEBFONT. Fonte do sistema — a parede tem de subir com a internet
        oscilando.

     TAMANHO DA LETRA (o único parâmetro que existe)
     ──────────────────────────────────────────────
        mural.html?dist=0.6&pol=15     ← monitor de mesa 15" a 60 cm (padrão)
        mural.html?dist=6&pol=55       ← a TV, quando ela existir
     A conta: altura de letra ≥ distância/200 (regra de sinalização), convertida
     para pixels pela densidade real da tela (diagonal em px ÷ diagonal em mm).
     Sem parâmetro nenhum a página assume 15" a 60 cm.

     OUTROS PARÂMETROS (todos opcionais)
        ?ref=180            segundos entre releituras (mín. 60)
        ?concluidas=0       dias de OS concluída no quadro (0 = só o que está na oficina)
        ?debug=1            mostra o rodapé técnico (versão, tempos, erro da última leitura)

     ATALHOS DE TECLADO (não há UI para eles, de propósito)
        F = tela cheia · R = releitura imediata

     ⚠ O QUE ESTA PÁGINA NÃO FAZ, E POR QUÊ
     · Não mostra "quem está livre agora". `getKanbanOficina` traz `em_execucao`
       (quem está EM tarefa), e é isso que o mural mostra. Técnico OCIOSO exige
       cruzar a lista de usuários ativos com os locks — é a action de leitura
       `getMural` da fase 2, e inventá-la por heurística aqui produziria "Bruno
       está livre" na parede com o Bruno em pé ao lado. Não vale.
     · Não mostra OS externa/preventiva: o quadro é o que está NA oficina
       (`somenteInternas` no GAS). Externas ganham mural próprio.

     ⚠ ACHADO PARA O FERNANDO (não corrigido aqui, de propósito)
       `posicao_fila` ordena por prioridade e depois por `data_abertura` — não
       por `custodia_desde`. Ou seja: o v119 já MOSTRA os dias de oficina, mas a
       ORDEM da fila ainda conta da abertura da OS. Numa máquina que ficou duas
       semanas no pátio antes de a OS ser aberta, o "➊" e o "35d na oficina"
       discordam. Corrigir isso é mexer no `_filaOficinaCalc_` (GAS) e muda a
       fila do PCF junto — decisão sua, não minha, e fora desta entrega.

<script>
(function(){
'use strict';

// ══════════════════════════════════════════════════════════════════════════
// 0 · CONTRATO DE REDE — as mesmas constantes dos outros fronts
// ⚠ A API_KEY é o sha256 de "123456" e já está embutida nos 5 fronts públicos.
//   Ela NÃO é segredo (o CLAUDE.md registra isso desde 24/08). Quando o Bloco C
//   rodar a chave, este arquivo entra na mesma varredura dos outros.
// ══════════════════════════════════════════════════════════════════════════
var GAS_URL = 'https://script.google.com/macros/s/AKfycbz_qSb4Ib6VoZs4TE15EYp9qO5sSEhrjadY71yK0Sd4vqnu4msidsObXnQtkCGXpIqq/exec';
var API_KEY = 'fb9e6bd8b112a4a50eb30fbcedc7681fc29c331af4600584656ade9dace002da';
var BUILD   = 'MURAL_V2';

var Q = new URLSearchParams(location.search);
var CFG = {
  dist:       Math.max(0.3, parseFloat(Q.get('dist')) || 0.6),   // metros
  pol:        Math.max(7,   parseFloat(Q.get('pol'))  || 15),    // polegadas
  ref:        Math.max(60,  parseInt(Q.get('ref'), 10) || 180),  // segundos
  concluidas: String(parseInt(Q.get('concluidas'), 10) || 0),
  debug:      Q.get('debug') === '1'
};

// ══════════════════════════════════════════════════════════════════════════
// 1 · TAMANHO DA LETRA — regra de sinalização, aplicada à tela REAL
// ──────────────────────────────────────────────────────────────────────────
// altura mínima de caractere ≈ distância / 200. Converter mm→px exige a
// densidade da tela, e ela sai da diagonal em px ÷ diagonal em mm (a polegada
// é o único dado que o navegador NÃO sabe — por isso `?pol=`).
// O clamp existe porque um `?pol=` errado não pode transformar o quadro em
// duas palavras gigantes: erro de parâmetro degrada o tamanho, não a tela.
// ══════════════════════════════════════════════════════════════════════════
function calcularBase(dist, pol, w, h){
  var diagPx = Math.sqrt(w*w + h*h);
  var ppmm   = diagPx / (pol * 25.4);
  var capMm  = (dist * 1000) / 200;
  var capPx  = capMm * ppmm;
  var base   = capPx / 0.72;              // cap-height ≈ 0,72 do corpo
  return Math.round(Math.max(15, Math.min(78, base)));
}
function aplicarBase(){
  var b = calcularBase(CFG.dist, CFG.pol,
                       window.innerWidth || 1920, window.innerHeight || 1080);
  document.documentElement.style.setProperty('--base', b + 'px');
  return b;
}

// ══════════════════════════════════════════════════════════════════════════
// 2 · AGRUPAMENTO DE FASES — cópia EXATA do _GOS_GRUPOS_FASE do PCM V128
// ⚠ Se o PCM ganhar um grupo novo, ele entra AQUI TAMBÉM, com data e motivo.
//   Duas listas que divergem = mural e PCM com colunas diferentes para o mesmo
//   dado, que é a pior coisa que uma tela de parede pode fazer.
// ══════════════════════════════════════════════════════════════════════════
var GRUPOS_FASE = [
  { nome: 'Diagnósticos', re: /diagn/i }   // 22/08 — 4 colunas quase vazias viravam 1
];
function grupoDaFase(fase){
  var f = String(fase == null ? '' : fase);
  if (!f) return '';
  for (var i = 0; i < GRUPOS_FASE.length; i++){
    if (GRUPOS_FASE[i].re.test(f)) return GRUPOS_FASE[i].nome;
  }
  return '';
}

// ══════════════════════════════════════════════════════════════════════════
// 3 · FUNÇÕES PURAS (é o que a bancada testa)
// ══════════════════════════════════════════════════════════════════════════

// 3.1 — o rótulo dos dias. NUNCA diz "na oficina" sem custódia registrada.
function rotuloDias(c){
  var d = c && c.dias_na_oficina;
  if (typeof d === 'number' && isFinite(d) && d >= 0){
    // 0 é MEDIDO (chegou hoje) — e "0d na oficina" numa parede lê-se como
    // "sem dado". A palavra é mais clara que o número; o valor não mudou.
    return { n: d, texto: (d === 0 ? 'chegou hoje' : d + 'd na oficina'), medido: true };
  }
  var f = (c && typeof c.dias_na_fila === 'number') ? c.dias_na_fila : null;
  if (f === null) return { n: null, texto: '', medido: false };
  return { n: f, texto: f + 'd desde a abertura', medido: false };
}

// 3.2 — travadas. ÚNICA fonte: o campo do GAS v119. Zero heurística.
function travadas(cards){
  return (cards || []).filter(function(c){ return c && c.bloqueada === true; });
}

// 3.3 — a próxima da fila. `posicao_fila` vem PRONTA do servidor; aqui só se
// escolhe, entre as OS que ainda estão na fila, a de menor posição. Travada
// não concorre (decisão do Fernando: bloqueada SAI da fila até destravar), e
// concluída também não.
function proximaDaFila(cards){
  var cand = (cards || []).filter(function(c){
    return c && c.bloqueada !== true && c.situacao !== 'concluida'
             && typeof c.posicao_fila === 'number' && c.posicao_fila > 0;
  });
  if (!cand.length) return null;
  return cand.reduce(function(a, b){ return b.posicao_fila < a.posicao_fila ? b : a; });
}

// 3.4 — colunas do quadro: as do GAS, agrupadas, mais a terminal se houver
// card concluído carregado. Mesma lógica do _gosPintarOficina do PCM V138.
var ORD_SIT = { atrasada:5, risco:4, ok:3, sem_meta:2, concluida:1 };
function montarColunas(cache){
  var cards = (cache && cache.cards) || [];
  var cols = [], idx = {};
  ((cache && cache.colunas) || []).forEach(function(c){
    var g = grupoDaFase(c.fase);
    var k = String(g || c.fase).toLowerCase();
    var ja = idx[k];
    if (ja){
      ja.fase_ordem = Math.min(ja.fase_ordem == null ? 999 : ja.fase_ordem,
                               c.fase_ordem  == null ? 999 : c.fase_ordem);
      if ((c.meta_dias||0) > (ja.meta_dias||0)) ja.meta_dias = c.meta_dias;
      if (c.saude){
        ja.saude = ja.saude || { atrasada:0, risco:0 };
        ja.saude.atrasada = (ja.saude.atrasada||0) + (c.saude.atrasada||0);
        ja.saude.risco    = (ja.saude.risco   ||0) + (c.saude.risco   ||0);
      }
      return;
    }
    var nova = { fase: g || c.fase, fase_ordem: c.fase_ordem, camada_ordem: c.camada_ordem,
                 meta_dias: c.meta_dias || 0,
                 saude: c.saude ? { atrasada: c.saude.atrasada||0, risco: c.saude.risco||0 } : null,
                 itens: [] };
    idx[k] = nova; cols.push(nova);
  });

  var terminal = { fase: '✅ Concluídas', terminal: true, itens: [] };
  cards.forEach(function(c){
    if (!c.fase_atual){ terminal.itens.push(c); return; }
    var g = grupoDaFase(c.fase_atual);
    var k = String(g || c.fase_atual).toLowerCase();
    if (!idx[k]){
      idx[k] = { fase: g || c.fase_atual, fase_ordem: 999, camada_ordem: c.camada_atual || 1,
                 meta_dias: 0, saude: null, itens: [] };
      cols.push(idx[k]);
    }
    c._faseReal = (g && String(c.fase_atual) !== g) ? String(c.fase_atual) : '';
    idx[k].itens.push(c);
  });

  function ord(arr){
    arr.sort(function(a,b){
      var d = (ORD_SIT[b.situacao]||0) - (ORD_SIT[a.situacao]||0); if (d) return d;
      var f = (b.dias_na_fase||0) - (a.dias_na_fase||0);           if (f) return f;
      return (b.prioridade_rank||0) - (a.prioridade_rank||0);
    });
  }
  cols.forEach(function(c){ ord(c.itens); });
  ord(terminal.itens);
  if (terminal.itens.length) cols.push(terminal);
  return cols;
}

// 3.5 — índice de máquinas (id → rótulo). Vem de getItensNaOficina.
function indiceMaquinas(env){
  var m = {};
  ((env && env.itens) || []).forEach(function(i){
    var id = String(i.id || '').trim(); if (!id) return;
    var nome = String(i.nome || '').trim();
    var serie = String(i.serie || '').trim();
    m[id] = nome + (serie ? ' · ' + serie : '');
  });
  return m;
}
// Rótulo da máquina do card. Sem resolver ⇒ cai para o TIPO da OS; jamais
// exibe o ID cru (código de banco em parede não informa ninguém).
function rotuloMaquina(c, idx){
  var ids = Array.isArray(c && c.maquinas) ? c.maquinas : [];
  for (var i = 0; i < ids.length; i++){
    var r = idx[String(ids[i]).trim()];
    if (r) return r + (ids.length > 1 ? '  +' + (ids.length-1) : '');
  }
  return String((c && c.tipo_os) || '').trim();
}

// 3.6 — frescor do dado: quanto tempo desde a última leitura BOA.
function frescor(tsMs, agoraMs){
  if (!tsMs) return { texto: 'sem leitura', nivel: 'morto' };
  var min = Math.floor((agoraMs - tsMs) / 60000);
  var hh  = new Date(tsMs);
  var rel = 'dados de ' + String(hh.getHours()).padStart(2,'0') + ':' +
                          String(hh.getMinutes()).padStart(2,'0');
  if (min >= 15) return { texto: rel, nivel: 'morto' };
  if (min >= 6)  return { texto: rel, nivel: 'velho' };
  return { texto: rel, nivel: 'ok' };
}

// ══════════════════════════════════════════════════════════════════════════
// 4 · REDE — só GET, só leitura, sem header (nada de preflight no Apps Script)
// ══════════════════════════════════════════════════════════════════════════
function gsGet(action, params){
  var qs = new URLSearchParams(Object.assign({ action: action, key: API_KEY }, params || {}));
  var opts = {};
  try { opts.signal = AbortSignal.timeout(25000); } catch(e){}
  return fetch(GAS_URL + '?' + qs.toString(), opts).then(function(r){ return r.json(); });
}

// ══════════════════════════════════════════════════════════════════════════
// 5 · ESTADO
// ══════════════════════════════════════════════════════════════════════════
var ST = { quadro:null, quadroTs:0, maqIdx:{}, maqTs:0, erro:'', ciclos:0 };

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════════════════════
// 6 · PINTURA
// ══════════════════════════════════════════════════════════════════════════
function pintar(){
  if (!ST.quadro) return;
  var cache = ST.quadro;
  var cards = cache.cards || [];
  var R = cache.resumo || {};
  var prox = proximaDaFila(cards);
  var trav = travadas(cards);

  // KPIs — todos vêm do `resumo` do GAS. `travadas` é contagem do próprio
  // campo, não estimativa.
  var kp = [];
  kp.push('<div class="kpi"><b>' + (R.abertas != null ? R.abertas : cards.length) +
          '</b><span>na oficina</span></div>');
  if (R.atrasadas) kp.push('<div class="kpi red"><b>' + R.atrasadas + '</b><span>atrasadas</span></div>');
  if (R.risco)     kp.push('<div class="kpi amb"><b>' + R.risco + '</b><span>em risco</span></div>');
  if (trav.length) kp.push('<div class="kpi rox"><b>' + trav.length + '</b><span>travadas</span></div>');
  if (R.concluidas)kp.push('<div class="kpi grn"><b>' + R.concluidas + '</b><span>concluídas</span></div>');
  document.getElementById('kpis').innerHTML = kp.join('');

  // Colunas
  var cols = montarColunas(cache);
  var html = cols.map(function(col){
    var cor = col.terminal ? '#16a34a' : ((col.camada_ordem > 1) ? '#7c5cff' : '#0d9488');
    var s = col.saude;
    var saude = s ? ((s.atrasada ? '<i style="color:#ef4444">🔴' + s.atrasada + '</i>' : '') +
                     (s.risco    ? '<i style="color:#f59e0b">🟡' + s.risco    + '</i>' : '')) : '';
    var itens = col.itens.map(function(c){ return cardHtml(c, prox); }).join('') ||
                '<div class="kempty">—</div>';
    return '<div class="col"><div class="ch" style="border-top-color:' + cor + '">' +
             '<span class="nm">' + esc(col.fase) + '</span>' +
             '<span class="sd">' + saude + '</span>' +
             '<span class="n">' + col.itens.length + '</span>' +
           '</div><div class="cards">' + itens + '</div></div>';
  }).join('');
  document.getElementById('board').innerHTML = html;

  // Faixa de travadas — some inteira quando não há campo/quando não há travada.
  var fx = document.getElementById('faixa');
  if (trav.length){
    document.getElementById('faixaT').innerHTML = '🚧 Travadas · ' + trav.length;
    document.getElementById('faixaL').innerHTML = trav.slice(0, 6).map(function(c){
      var d = (typeof c.dias_bloqueada === 'number') ? '<span class="d">' + c.dias_bloqueada + 'd parada</span>' : '';
      var maq = rotuloMaquina(c, ST.maqIdx);
      return '<div class="bq"><div class="l1">' + esc(c.cliente || '—') + d + '</div>' +
             '<div class="l2">' + esc(maq) +
               (c.etapa_bloqueio ? ' · estava em ' + esc(c.etapa_bloqueio) : '') + '</div>' +
             '<div class="l3">' + esc(c.motivo_bloqueio || 'travada') + '</div></div>';
    }).join('');
    fx.classList.add('on');
  } else {
    fx.classList.remove('on');
    document.getElementById('faixaL').innerHTML = '';
  }

  document.getElementById('splash').classList.add('off');
  cortarColunas();
  pintarCabecalho();
}

function cardHtml(c, prox){
  var sit  = String(c.situacao || 'sem_meta');
  var dias = rotuloDias(c);
  var maq  = rotuloMaquina(c, ST.maqIdx);
  var ehProx = (prox && prox.id_os === c.id_os);
  var cls = 'mc s-' + sit + (c.bloqueada === true ? ' trav' : '') + (ehProx ? ' prox' : '');

  var ft = [];
  if (dias.texto){
    var ruim = (sit === 'atrasada') ? ' ruim' : '';
    ft.push('<span class="dias' + ruim + '">' + esc(dias.texto) + '</span>');
  }
  if (c.bloqueada === true){
    ft.push('<span class="trv">🚧 ' + esc(c.motivo_bloqueio || 'travada') + '</span>');
  } else if (Array.isArray(c.em_execucao) && c.em_execucao.length){
    ft.push('<span class="quem">🔧 ' + esc(c.em_execucao.map(function(x){ return x.por; }).join(', ')) + '</span>');
  }
  if (c.prioridade_rank >= 3) ft.push('<span style="color:#fca5a5">URGENTE</span>');

  return '<div class="' + cls + '">' +
    (ehProx ? '<span class="fifo">➊ PRÓXIMA DA FILA</span>' : '') +
    '<div class="cli">' + esc(c.cliente || '—') + '</div>' +
    (maq ? '<div class="maq">⚙ ' + esc(maq) + '</div>' : '') +
    '<div class="ft">' + ft.join('') + '</div>' +
    (c._faseReal ? '<div class="fase">📍 ' + esc(c._faseReal) + '</div>' : '') +
  '</div>';
}

// ── NÃO ROLA (regra 6) ─────────────────────────────────────────────────────
// Corta o que não coube e diz quantos ficaram de fora. Fazer isso no CSS não
// dá: `overflow:hidden` esconderia os cards SEM avisar, e uma coluna com 9 OS
// mostrando 5 sem dizer nada é uma tela que MENTE por omissão.
function cortarColunas(){
  var cols = document.querySelectorAll('.col');
  for (var i = 0; i < cols.length; i++){
    var lista = cols[i].querySelector('.cards');
    if (!lista) continue;
    var fora = 0, guarda = 0;
    while (lista.scrollHeight > lista.clientHeight + 1 && lista.children.length > 1 && guarda++ < 100){
      lista.removeChild(lista.lastElementChild);
      fora++;
    }
    if (fora){
      var m = document.createElement('div');
      m.className = 'mais';
      m.textContent = '+ ' + fora + ' não cabe' + (fora > 1 ? 'm' : '') + ' na tela';
      cols[i].appendChild(m);
      // o rodapé "+N" ocupa altura: pode ser preciso tirar mais um card
      if (lista.scrollHeight > lista.clientHeight + 1 && lista.children.length > 1){
        lista.removeChild(lista.lastElementChild);
        m.textContent = '+ ' + (fora + 1) + ' não cabem na tela';
      }
    }
  }
}

function pintarCabecalho(){
  var agora = new Date();
  document.getElementById('relogio').textContent =
    String(agora.getHours()).padStart(2,'0') + ':' + String(agora.getMinutes()).padStart(2,'0');
  var dias = ['dom','seg','ter','qua','qui','sex','sáb'];
  document.getElementById('hdSub').textContent =
    'gestão à vista · ' + dias[agora.getDay()] + ' ' +
    String(agora.getDate()).padStart(2,'0') + '/' + String(agora.getMonth()+1).padStart(2,'0');

  var f = frescor(ST.quadroTs, agora.getTime());
  var el = document.getElementById('fresc');
  el.textContent = f.texto;
  el.className = 'fresc' + (f.nivel === 'ok' ? '' : ' ' + f.nivel);

  if (CFG.debug){
    var d = document.getElementById('dbg');
    d.classList.add('on');
    d.textContent = 'build ' + BUILD + ' · base ' +
      getComputedStyle(document.documentElement).getPropertyValue('--base').trim() +
      ' · dist ' + CFG.dist + 'm · ' + CFG.pol + '" · ciclo ' + ST.ciclos +
      ' · refresh ' + CFG.ref + 's · concluídas ' + CFG.concluidas + 'd' +
      (ST.erro ? ' · ÚLTIMO ERRO: ' + ST.erro : '');
  }
}

// ══════════════════════════════════════════════════════════════════════════
// 7 · CICLO
// ══════════════════════════════════════════════════════════════════════════
function falhaSemCache(msg){
  document.getElementById('splashT').textContent = 'Não consegui ler o quadro';
  document.getElementById('splashS').textContent =
    msg + ' — vou tentar de novo em ' + CFG.ref + 's. A tela não mostra dado velho como se fosse de agora.';
  document.getElementById('splash').classList.remove('off');
}

function ciclo(){
  ST.ciclos++;
  // getItensNaOficina muda devagar (é entrada/saída de máquina): 1ª vez e a
  // cada 30 min. Não vale uma leitura da aba MAQUINAS a cada 3 minutos.
  var precisaMaq = (!ST.maqTs || (Date.now() - ST.maqTs) > 30*60000);
  var pMaq = precisaMaq
    ? gsGet('getItensNaOficina').then(function(env){
        if (env && env.status === 'ok'){ ST.maqIdx = indiceMaquinas(env); ST.maqTs = Date.now(); }
      }).catch(function(){ /* o nome da máquina é acessório — nunca derruba o quadro */ })
    : Promise.resolve();

  return pMaq.then(function(){
    return gsGet('getKanbanOficina', { dias_concluidas: CFG.concluidas });
  }).then(function(env){
    if (!env || env.status !== 'ok') throw new Error((env && env.error) || 'envelope inválido');
    ST.quadro = env; ST.quadroTs = Date.now(); ST.erro = '';
    pintar();
  }).catch(function(e){
    ST.erro = String((e && e.message) || e);
    if (!ST.quadro) falhaSemCache(ST.erro);
    else pintarCabecalho();   // mantém o último quadro bom e envelhece o carimbo
  });
}

// ══════════════════════════════════════════════════════════════════════════
// 8 · PARTIDA
// ══════════════════════════════════════════════════════════════════════════
aplicarBase();
pintarCabecalho();
ciclo();
setInterval(ciclo, CFG.ref * 1000);
setInterval(pintarCabecalho, 20000);          // relógio e carimbo de frescor
window.addEventListener('resize', function(){ aplicarBase(); if (ST.quadro) pintar(); });

// Atalhos sem UI (regra 5: nada clicável na tela).
document.addEventListener('keydown', function(e){
  var k = String(e.key || '').toLowerCase();
  if (k === 'f'){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  if (k === 'r') ciclo();
});

// Superfície para a bancada. Não é API: é o que o teste headless dirige.
window.__mural = {
  build: BUILD, CFG: CFG, ST: ST,
  calcularBase: calcularBase, grupoDaFase: grupoDaFase, rotuloDias: rotuloDias,
  travadas: travadas, proximaDaFila: proximaDaFila, montarColunas: montarColunas,
  indiceMaquinas: indiceMaquinas, rotuloMaquina: rotuloMaquina, frescor: frescor,
  ciclo: ciclo, pintar: pintar
};
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     PWAIT v1 — A ESPERA FICA VISÍVEL, SEMPRE (+ GUARDA DE BOTÃO)
     Pedido do Fernando em 17/09/2026: "sempre programar pensando em otimizar
     tempo de abertura das telas e spinner sempre que for necessário aguardar, ou
     mensagens avisando e deixando o usuário ciente da espera".
     O problema que ele resolve: o `_comLoadingBtn_` (PCM v77 / PCF v55) só cobre
     o BOTÃO que alguém se lembrou de embrulhar. Toda chamada disparada por
     troca de tela, por refresh de 2º plano ou por um botão esquecido acontecia
     em silêncio — e no GAS cada chamada custa ~3,5 s fixos (medição de 28/08).
     Como funciona: PWAIT não pede wiring por tela. Ele CONTA as chamadas em voo
     (fetch, XMLHttpRequest e o <script> do JSONP dos formulários) e mostra:
       · barra viva no topo enquanto houver qualquer chamada;
       · aos 3,5 s, um aviso discreto "aguardando o servidor…";
       · aos 9 s, o aviso vira explicação ("o Google Sheets às vezes demora…").
     NUNCA bloqueia a tela e NUNCA interfere na resposta: o wrapper devolve a
     mesma promessa e repropaga o mesmo erro.
     ADITIVO: nenhum id, função ou classe existente muda. Tudo em try/catch.
     ── A GUARDA DE BOTÃO (mesma sentada, antes de qualquer publicação) ────
     A varredura de paridade mediu **46 botões que gravam sem trava de duplo
     clique** em 19 arquivos. Consertar 46 call sites é trabalho que envelhece:
     o 47º nasce sem trava. Então a trava passou a ser MECANISMO, não hábito.
     `PWAIT.guarda()` escuta clique e submit na fase de CAPTURA e, 130 ms depois
     do clique, pergunta uma coisa só: **o número de chamadas em voo SUBIU?**
     Se subiu, aquele clique gerou rede — o botão fica ocupado (⏳ no texto,
     desabilitado) até a contagem voltar ao que era antes dele. Um 2º clique
     nesse meio-tempo é ENGOLIDO na captura, antes de chegar ao app.
     🔑 A atribuição é por DELTA, não por "tem chamada em voo": senão um
        refresh de 2º plano (o PCM faz vários) desabilitaria botão à toa.
     ⚠ Fora da guarda, de propósito: pílula/chip/toggle/olho/burger, botão com
       `aria-pressed` ou `role=switch`, botão de rótulo curto (ícone, seta) e
       qualquer um com `data-pw-off`. Marcar Ok/NOK/N.A. batendo o dedo não
       pode esperar por nada.
     ⚠ BLOCO ÚNICO: copiado BYTE A BYTE nos fronts; a varredura reprova divergência.
     ═══════════════════════════════════════════════════════════════════════════ -->
<style>

<script>
(function(){
'use strict';
try{
  if(window.PWAIT) return;
  var VER='PWAIT_V1';
  var T_AVISO=3500;      // a espera deixa de ser invisível
  var T_EXPLICA=9000;    // a espera passa a ser explicada
  var voo=0, t0=0, bar=null, msg=null, ov=null, tA=null, tE=null, raf=null, prog=0;

  function tokens(){
    try{
      var cs=getComputedStyle(document.body);
      var m=/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(cs.backgroundColor||'');
      var lum=m? (0.299*+m[1]+0.587*+m[2]+0.114*+m[3]) : 255;
      var claro=lum>=140, r=document.documentElement.style;
      r.setProperty('--pw-a', claro?'#2563eb':'#f58220');
      r.setProperty('--pw-b', claro?'#22c55e':'#fbbf24');
      r.setProperty('--pw-bg', claro?'#ffffff':(m?'rgb('+Math.min(255,+m[1]+16)+','+Math.min(255,+m[2]+18)+','+Math.min(255,+m[3]+24)+')':'#1e293b'));
      r.setProperty('--pw-fg', cs.color||'inherit');
      r.setProperty('--pw-line', claro?'#dfe3ea':'rgba(255,255,255,.2)');
      r.setProperty('--pw-hov', claro?'#f4f6f9':'rgba(255,255,255,.08)');
    }catch(e){}
  }
  function el(id,cls,html){
    var d=document.getElementById(id);
    if(d) return d;
    d=document.createElement('div'); d.id=id; if(cls)d.className=cls; if(html)d.innerHTML=html;
    (document.body||document.documentElement).appendChild(d);
    return d;
  }
  function montar(){
    tokens();
    bar=el('pwBar');
    msg=el('pwMsg','','<span class="pw-sp"></span><span data-pw-txt>aguardando o servidor…</span>');
    ov=el('pwOv','','<div class="pw-cx"><div class="pw-sp2"></div><div class="pw-t" data-pw-ovt>Aguarde…</div><div class="pw-s" data-pw-ovs></div></div>');
  }
  function pinta(){
    if(!bar) return;
    if(voo>0){
      bar.classList.add('pw-on');
      prog=prog+ (92-prog)*0.06 + 0.4;           // nunca chega a 100 sozinha
      if(prog>93) prog=93;
      bar.style.width=prog.toFixed(1)+'%';
      raf=requestAnimationFrame(pinta);
    }else{
      bar.style.width='100%';
      setTimeout(function(){ if(voo===0){ bar.classList.remove('pw-on'); bar.style.width='0'; prog=0; } },240);
    }
  }
  function aviso(txt){
    if(!msg) return;
    var s=msg.querySelector('[data-pw-txt]'); if(s) s.textContent=txt;
    msg.classList.add('pw-on');
  }
  function some(){ if(msg) msg.classList.remove('pw-on'); }

  function sobe(){
    voo++;
    if(voo===1){
      t0=Date.now(); prog=2;
      if(!bar) montar();
      cancelAnimationFrame(raf); raf=requestAnimationFrame(pinta);
      clearTimeout(tA); clearTimeout(tE);
      tA=setTimeout(function(){ if(voo>0) aviso('aguardando o servidor…'); },T_AVISO);
      tE=setTimeout(function(){ if(voo>0) aviso('ainda aguardando — o Google Sheets às vezes leva alguns segundos. Não feche a tela.'); },T_EXPLICA);
    }
  }
  function desce(){
    voo=Math.max(0,voo-1);
    if(voo===0){ clearTimeout(tA); clearTimeout(tE); some(); pinta(); }
  }

  // ── 1) fetch ──
  try{
    if(window.fetch && !window.fetch.__pw){
      var f0=window.fetch.bind(window);
      var f1=function(){
        sobe();
        var p;
        try{ p=f0.apply(null,arguments); }catch(e){ desce(); throw e; }
        return p.then(function(r){ desce(); return r; }, function(e){ desce(); throw e; });
      };
      f1.__pw=1; window.fetch=f1;
    }
  }catch(e){}

  // ── 2) XMLHttpRequest ──
  try{
    var XP=window.XMLHttpRequest && window.XMLHttpRequest.prototype;
    if(XP && !XP.__pw){
      var s0=XP.send;
      XP.send=function(){
        var fim=false, self=this;
        function ok(){ if(!fim){ fim=true; desce(); } }
        try{
          sobe();
          self.addEventListener('loadend',ok);
        }catch(e){ ok(); }
        try{ return s0.apply(self,arguments); }catch(e){ ok(); throw e; }
      };
      XP.__pw=1;
    }
  }catch(e){}

  // ── 3) JSONP dos formulários: <script src="…/exec?…"> ──
  // Os forms falam com o GAS por tag <script>, não por fetch. Sem isto, o
  // "Salvar" de um formulário em campo ficaria exatamente como está hoje:
  // 20 s de espera com um botão cinza e nenhuma palavra na tela.
  try{
    var mo=new MutationObserver(function(recs){
      for(var i=0;i<recs.length;i++){
        var ns=recs[i].addedNodes;
        for(var j=0;j<ns.length;j++){
          var n=ns[j];
          if(!n||n.tagName!=='SCRIPT'||!n.src||n.__pw) continue;
          if(!/script\.google\.com|googleusercontent|supabase/.test(n.src)) continue;
          n.__pw=1; sobe();
          var fim=false;
          var pronto=function(){ if(!fim){ fim=true; desce(); } };
          n.addEventListener('load',pronto); n.addEventListener('error',pronto);
          setTimeout(pronto,120000);          // rede que nunca responde não deixa a barra presa
        }
      }
    });
    mo.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}


  // ── 4) GUARDA DE BOTÃO: spinner + trava de duplo clique, sem tocar em call site ──
  function podeGuardar(b){
    try{
      if(!b||!b.tagName) return false;
      if(b.hasAttribute('data-pw-off')) return false;
      if(b.closest&&b.closest('[data-pw-off]')) return false;
      var c=' '+String(b.className||'')+' ';
      if(/pill|chip|toggle|olho|burger|ecard|-tab|tab-/i.test(c)) return false;
      if(b.hasAttribute('aria-pressed')) return false;
      if(String(b.getAttribute('role')||'')==='switch') return false;
      var t=(b.textContent||'').trim();
      if(b.type!=='submit' && t.length<4) return false;    // ícone, pílula, seta
      return true;
    }catch(e){ return false; }
  }
  function ocupar(b,base){
    if(b.dataset.pwBusy==='1') return;
    var txt=b.textContent, dis=!!b.disabled, filhos=!!b.querySelector('*');
    b.dataset.pwBusy='1';
    b.classList.add('is-busy');
    if(!filhos && txt && txt.trim().length>3) b.textContent='⏳ '+txt.trim();
    try{ b.disabled=true; }catch(e){}
    var t0=Date.now();
    var iv=setInterval(function(){
      if(voo<=base || Date.now()-t0>60000){
        clearInterval(iv);
        try{
          b.classList.remove('is-busy');
          if(!filhos && txt) b.textContent=txt;
          b.disabled=dis;
        }catch(e){}
        delete b.dataset.pwBusy;
      }
    },140);
  }
  function vigiar(b){
    var base=voo;
    setTimeout(function(){ if(voo>base) ocupar(b,base); },130);   // só se ESTE clique gerou rede
  }
  function noClique(ev){
    try{
      var el=ev.target; if(!el||!el.closest) return;
      var b=el.closest('button,input[type=submit]'); if(!b) return;
      if(b.dataset.pwBusy==='1'){                                  // 2º clique: engolido aqui
        ev.preventDefault(); ev.stopImmediatePropagation();
        aviso('esse botão já está processando — aguarde a resposta do servidor.');
        return;
      }
      if(podeGuardar(b)) vigiar(b);
    }catch(e){}
  }
  function noSubmit(ev){
    try{
      var f=ev.target; if(!f||f.tagName!=='FORM') return;
      var b=f.querySelector('button[type=submit],input[type=submit],button:not([type])');
      if(!b) return;
      if(b.dataset.pwBusy==='1'){ ev.preventDefault(); ev.stopImmediatePropagation(); return; }
      vigiar(b);
    }catch(e){}
  }

  window.PWAIT={
    versao:VER,
    guarda:function(){ try{ document.addEventListener('click',noClique,true); document.addEventListener('submit',noSubmit,true); }catch(e){} },
    podeGuardar:podeGuardar,
    emVoo:function(){ return voo; },
    // espera com mensagem própria, para trecho que NÃO é chamada de rede
    // (gerar PDF, desenhar canvas, montar 2.000 linhas)
    tela:function(titulo,sub){
      if(!ov) montar();
      var a=ov.querySelector('[data-pw-ovt]'), b=ov.querySelector('[data-pw-ovs]');
      if(a) a.textContent=titulo||'Aguarde…';
      if(b) b.textContent=sub||'';
      ov.classList.add('pw-on');
      return function(){ ov.classList.remove('pw-on'); };
    },
    fim:function(){ if(ov) ov.classList.remove('pw-on'); },
    // só mostra a tela de espera se o trecho passar de `atraso` ms (sem piscada)
    demorado:function(fn,titulo,sub,atraso){
      var fechar=null, tt=setTimeout(function(){ fechar=window.PWAIT.tela(titulo,sub); },atraso==null?350:atraso);
      var pronto=function(){ clearTimeout(tt); if(fechar) fechar(); };
      var r;
      try{ r=fn(); }catch(e){ pronto(); throw e; }
      if(r&&typeof r.then==='function') return r.then(function(v){ pronto(); return v; },function(e){ pronto(); throw e; });
      pronto(); return r;
    },
    // par do _comLoadingBtn_ do PCM/PCF, para os fronts que não têm o helper
    btn:function(btnEl,fn){
      if(!btnEl) return fn();
      var txt=btnEl.textContent, dis=btnEl.disabled;
      btnEl.disabled=true; btnEl.classList.add('is-busy'); btnEl.textContent='⏳ Processando…';
      var volta=function(){ btnEl.disabled=dis; btnEl.classList.remove('is-busy'); btnEl.textContent=txt; };
      var r;
      try{ r=fn(); }catch(e){ volta(); throw e; }
      if(r&&typeof r.then==='function') return r.then(function(v){ volta(); return v; },function(e){ volta(); throw e; });
      volta(); return r;
    },
    // esqueleto: a tela mostra a FORMA do conteúdo antes do dado chegar
    esqueleto:function(alvo,linhas){
      var t=typeof alvo==='string'? document.getElementById(alvo)||document.querySelector(alvo) : alvo;
      if(!t) return;
      var n=linhas||6, h='<div class="pw-esq">';
      for(var i=0;i<n;i++) h+='<i style="width:'+(96-(i%4)*13)+'%"></i>';
      t.innerHTML=h+'</div>';
    }
  };

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar);
  else montar();
  window.PWAIT.guarda();
}catch(e){ try{ console.error('[PWAIT] nao iniciou; a espera segue invisivel',e); }catch(_){} }
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     ERRO v1 — ERRO NUNCA ACONTECE EM SILÊNCIO
     Par do PCM V108 (item 8), que criou este tratador no PCM depois do incidente
     v39: um ReferenceError no boot deixava o app quebrado SEM DEIXAR RASTRO.
     Em 17/09/2026 a varredura de paridade mostrou que a lição nunca viajou:
     PCM, PCF e Hub tinham o tratador; **Portal do Cliente, Mural, Ficha de
     Rotores e os 14 formulários não tinham nenhum** — e o Portal é a tela que
     o CLIENTE olha.
     O que faz:
       · `window.onerror` e `unhandledrejection`, os dois, com anti-repetição
         (o mesmo erro não aparece duas vezes em 15 s, no máximo 1 aviso / 4 s);
       · traduz falha de rede para a frase que importa:
         "Sem conexão — a alteração NÃO foi gravada.";
       · usa o `toast()` do app quando existe; quando não existe, desenha o
         próprio aviso (Portal e Mural não têm toast).
     ⚠ NÃO entra em front que já tem tratador próprio (PCM, PCF, Hub): dois
       tratadores = aviso em dobro. Quem controla isso é a lista do aplicador,
       e a varredura confere que TODO front tem UM.
     ⚠ BLOCO ÚNICO: copiado BYTE A BYTE; a varredura reprova divergência.
     ═══════════════════════════════════════════════════════════════════════════ -->
<style>
#perrToast{position:fixed;z-index:99600;left:50%;transform:translateX(-50%);bottom:20px;
  max-width:calc(100vw - 28px);background:#b42318;color:#fff;border-radius:10px;padding:11px 16px;
  font:13.5px/1.45 inherit;box-shadow:0 10px 32px rgba(0,0,0,.35);display:none;text-align:left}
#perrToast.perr-on{display:block}
@media print{#perrToast{display:none!important}}
</style>
<script>
(function(){
'use strict';
try{
  if(window.__PERR) return;
  window.__PERR='ERRO_V1';
  var vistos={}, ultimo=0;

  function proprio(txt){
    var el=document.getElementById('perrToast');
    if(!el){
      el=document.createElement('div'); el.id='perrToast';
      (document.body||document.documentElement).appendChild(el);
    }
    el.textContent=txt;
    el.className='perr-on';
    setTimeout(function(){ if(el.textContent===txt) el.className=''; },7000);
  }
  function mostrar(tipo,msg,detalhe){
    try{
      var agora=Date.now();
      var chave=tipo+'|'+String(msg).slice(0,120);
      if(vistos[chave] && agora-vistos[chave]<15000) return;   // não repete o mesmo em 15 s
      vistos[chave]=agora;
      try{ console.error('[ERRO_V1]['+tipo+']',msg,detalhe||''); }catch(e){}
      if(agora-ultimo<4000) return;                            // no máx. 1 aviso a cada 4 s
      ultimo=agora;
      var t=String(msg||'erro desconhecido');
      if(/OFFLINE|Failed to fetch|NetworkError|Load failed|Sem conex/i.test(t))
        t='Sem conexão — a alteração NÃO foi gravada.';
      if(typeof window.toast==='function'){ try{ window.toast('⚠ '+t,'error'); return; }catch(e){} }
      proprio('⚠ '+t);
    }catch(e){ /* o tratador de erro nunca pode ser a causa de um erro */ }
  }
  window.addEventListener('error',function(ev){
    if(ev && ev.target && ev.target!==window && ev.target.tagName) return;   // 404 de <img>/<script>
    mostrar('erro',(ev&&ev.message)||'falha no script',
            ev&&ev.filename? (ev.filename+':'+ev.lineno):'');
  });
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev&&ev.reason;
    mostrar('promessa',(r&&r.message)||String(r||'promessa rejeitada'), r&&r.stack);
  });
  window.__perrUltimos=function(){ return vistos; };
}catch(e){}
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     CFX v1 — FILTRO DE COLUNA (estilo Excel) EM QUALQUER TABELA
     Pedido do Fernando em 17/09/2026: "toda tela que contém lista de máquinas,
     clientes, peças etc, os títulos de cada coluna devem ser dotados de filtros".
     Motivo de existir: o motor XF (V94) resolve isso, mas exige configuração
     tela por tela — e por isso só 5 das 36 tabelas do PCM tinham filtro. A tela
     de Inventário (V190) nasceu sem, como toda tela nova nasceria.
     O CFX não substitui o XF: ele se acopla ao DOM JÁ RENDERIDO, leia quem
     renderizou. Tabela com `class="xf-table"` é ignorada de propósito.
     ADITIVO por construção: nenhum id, função, classe ou render existente muda.
     Tudo dentro de try/catch — o motor NUNCA pode ser a causa de um erro de boot.
     ⚠ BLOCO ÚNICO: este arquivo é copiado BYTE A BYTE nos fronts. Se divergir

<style>

</style>
<script>
(function(){
'use strict';
try{
  if(window.CFX) return;
  var VER='CFX_V1';
  var MIN_LINHAS=3;          // tabela de 1 ou 2 linhas não ganha filtro (ruído)
  var MAX_VALORES=400;       // teto de valores distintos listados no menu
  var MAX_LINHAS=4000;       // acima disso o motor se recusa (e diz por quê)
  var CAB_IGNORAR={'':1,'#':1,'ações':1,'acoes':1,'ação':1,'acao':1,'ver':1,'abrir':1,'sel':1,' ':1};

  var S={};                  // chave da tabela -> estado {f:{}, sort:null}
  var vivos=(typeof WeakSet==='function')? new WeakSet() : null;  // botões com handler de verdade
  var menu=null, mAlvo=null, mCol=-1, mBusca='';
  var mo=null, timer=null, proprio=0;

  function norm(v){
    return String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  }
  function txt(el){
    if(!el) return '';
    var d=el.getAttribute&&el.getAttribute('data-cfx-val');
    if(d!=null) return String(d).trim();
    return (el.textContent||'').replace(/\s+/g,' ').trim();
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function dataBR(s){
    var m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s).trim());
    return m? (m[3]+m[2]+m[1]) : null;
  }
  function numDe(s){
    var t=String(s).trim();
    if(!t) return null;
    if(!/\d/.test(t)) return null;
    // aceita  1.234,56  ·  1234  ·  R$ 1.200,00  ·  5.614 h  ·  -3  ·  12%
    if(!/^[-+]?[\sR$€]*[\d.,]+\s*(h|hs|horas|dias|d|%|km|kg|un|pç|pcs|m|mm|min)?$/i.test(t)) return null;
    var x=t.replace(/[^\d,.\-+]/g,'');
    if(x.indexOf(',')>=0) x=x.replace(/\./g,'').replace(',','.');
    // 🕳 achado da bancada: '1.200' ordenava como 1,2 e ia para ANTES de '90'.
    // Em pt-BR o ponto é milhar quando os grupos depois dele têm 3 dígitos.
    else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(x)) x=x.replace(/\./g,'');
    else if((x.match(/\./g)||[]).length>1) x=x.replace(/\./g,'');
    var n=parseFloat(x);
    return isNaN(n)? null : n;
  }

  // ── tokens de cor derivados do próprio app (um bloco, seis temas) ──
  function tokens(){
    try{
      var cs=getComputedStyle(document.body);
      var bg=cs.backgroundColor, fg=cs.color;
      var m=/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(bg||'');
      var lum=m? (0.299*+m[1]+0.587*+m[2]+0.114*+m[3]) : 255;
      var claro=lum>=140;
      var r=document.documentElement.style;
      r.setProperty('--cfx-bg', claro?'#ffffff':(m?'rgb('+Math.min(255,+m[1]+14)+','+Math.min(255,+m[2]+16)+','+Math.min(255,+m[3]+22)+')':'#1e293b'));
      r.setProperty('--cfx-fg', fg||'inherit');
      r.setProperty('--cfx-mut', claro?'#64748b':'#9aa8bf');
      r.setProperty('--cfx-line', claro?'#dfe3ea':'rgba(255,255,255,.16)');
      r.setProperty('--cfx-hov', claro?'#f4f6f9':'rgba(255,255,255,.07)');
      if(!r.getPropertyValue('--cfx-acc')) r.setProperty('--cfx-acc', claro?'#2563eb':'#f58220');
    }catch(e){}
  }

  // ── anatomia da tabela ──
  function cabecalho(t){
    if(!t.tHead||!t.tHead.rows.length) return null;
    var tr=t.tHead.rows[t.tHead.rows.length-1];
    for(var i=0;i<tr.cells.length;i++) if(tr.cells[i].colSpan>1) return null;  // cabeçalho agrupado: não é grade
    return tr;
  }
  function linhas(t,n){
    var out=[];
    for(var b=0;b<t.tBodies.length;b++){
      var rs=t.tBodies[b].rows;
      for(var i=0;i<rs.length;i++){
        var r=rs[i];
        if(r.hasAttribute('data-cfx-skip')||r.classList.contains('cfx-vazio')) continue;
        if(r.cells.length!==n) continue;                   // linha de grupo / colspan / "nenhum item"
        var ok=true;
        for(var c=0;c<r.cells.length;c++) if(r.cells[c].colSpan>1||r.cells[c].rowSpan>1){ok=false;break;}
        if(ok) out.push(r);
      }
    }
    return out;
  }
  function chave(t,cab){
    if(t.dataset.cfxKey) return t.dataset.cfxKey;
    var a=t.parentElement, id='';
    while(a&&a!==document.body){ if(a.id){id=a.id;break;} a=a.parentElement; }
    var h=[];
    for(var i=0;i<cab.cells.length;i++) h.push(norm(txt(cab.cells[i])));
    return (t.id||id||'raiz')+'#'+h.join('|').slice(0,180);
  }
  function est(k){ if(!S[k]) S[k]={f:{},sort:null}; return S[k]; }
  function temEstado(k){ var e=S[k]; return !!(e&&(e.sort||Object.keys(e.f).length)); }

  // ── colunas que não ganham menu: ação, seleção, só botões ──
  function filtravel(cab,i,rs){
    var h=norm(txt(cab.cells[i]));
    if(CAB_IGNORAR[h]) return false;
    var n=Math.min(rs.length,12), comCtrl=0, vis=0;
    for(var k=0;k<n;k++){
      var td=rs[k].cells[i]; if(!td) continue;
      vis++;
      if(td.querySelector&&td.querySelector('button,input,select,textarea,a[onclick]')) comCtrl++;
    }
    return !(vis&&comCtrl/vis>0.6);
  }

  function tipoCol(rs,i){
    var d=0,nu=0,tot=0;
    for(var k=0;k<rs.length&&k<60;k++){
      var v=txt(rs[k].cells[i]); if(!v||v==='—'||v==='-') continue;
      tot++;
      if(dataBR(v)) d++; else if(numDe(v)!=null) nu++;
    }
    if(!tot) return 'txt';
    if(d/tot>=0.7) return 'data';
    if(nu/tot>=0.7) return 'num';
    return 'txt';
  }
  function valOrd(v,tp){
    if(tp==='data'){ var d=dataBR(v); return d==null?null:+d; }
    if(tp==='num'){ return numDe(v); }
    return null;
  }

  // ── acoplagem ──
  function acoplar(t){
    if(t.dataset.cfx) return;
    if(t.classList.contains('xf-table')) { t.dataset.cfx='xf'; return; }      // motor XF já filtra
    if(t.getAttribute('data-cfx-off')!=null||t.closest('[data-cfx-off]')){ t.dataset.cfx='off'; return; }
    var cab=cabecalho(t);
    if(!cab){ t.dataset.cfx='sem-cabecalho'; return; }
    var rs=linhas(t,cab.cells.length);
    if(rs.length<MIN_LINHAS) return;                       // sem marca: volta a ser avaliada quando crescer
    if(rs.length>MAX_LINHAS){ t.dataset.cfx='grande'; return; }
    var k=chave(t,cab);
    t.dataset.cfx='on'; t.dataset.cfxK=k;
    menusDaTabela(t,cab,rs);
    barraDaTabela(t,k);
    aplicar(t);
  }

  // 🕳 Achado da bancada: `cloneNode`/`outerHTML` COPIA o botão ▾ mas NÃO copia o
  // handler — a tabela reaparecia com a setinha morta, e clicar nela não fazia nada
  // (sem erro nenhum no console). Por isso o botão só vale se estiver no WeakSet
  // de botões que ESTE motor criou nesta página; um clone é descartado e refeito.
  function menusDaTabela(t,cab,rs){
    for(var i=0;i<cab.cells.length;i++){
      var th=cab.cells[i];
      var velho=th.querySelector('.cfx-b');
      if(velho){
        if(!vivos||vivos.has(velho)) continue;
        velho.parentNode.removeChild(velho);
      }
      if(!filtravel(cab,i,rs)) continue;
      var b=document.createElement('button');
      b.className='cfx-b'; b.type='button'; b.textContent='▾';
      b.title='Filtrar e ordenar por esta coluna';
      b.setAttribute('data-cfx-i',String(i));
      b.onclick=(function(tab,idx){return function(ev){ ev.preventDefault(); ev.stopPropagation(); abrir(tab,idx,this); };})(t,i);
      th.appendChild(b);
      if(vivos) vivos.add(b);
    }
  }

  // uma barra por tabela, sempre: re-render deixava a barra velha para trás e o
  // "limpar tudo" da barra órfã mexia num nó que já não estava na tela.
  function barraDaTabela(t,k){
    var orf=document.querySelectorAll('[data-cfx-bar="'+String(k).replace(/"/g,'\\"')+'"]');
    for(var i=0;i<orf.length;i++) if(orf[i].parentNode) orf[i].parentNode.removeChild(orf[i]);
    var bar=document.createElement('div');
    bar.className='cfx-bar';
    bar.setAttribute('data-cfx-bar',k);
    (t.parentNode||document.body).insertBefore(bar,t);
    t._cfxBar=bar;
    return bar;
  }

  // ── filtro + ordenação ──
  function passa(e,r,cab,pular){
    for(var k in e.f){
      if(String(k)===String(pular)) continue;
      var i=+k, f=e.f[k], td=r.cells[i]; if(!td) return false;
      var v=txt(td);
      if(f.tipo==='vals'){ if(!f.set[v]) return false; }
      else if(f.tipo==='fx'){
        var tp=f.cmp||'txt', x=valOrd(v,tp);
        if(x==null) return false;
        if(f.min!=null&&x<f.min) return false;
        if(f.max!=null&&x>f.max) return false;
      }
      else if(f.tipo==='txt'){ if(norm(v).indexOf(f.q)<0) return false; }
    }
    return true;
  }

  function aplicar(t,silencio){
    var cab=cabecalho(t); if(!cab) return;
    var rs=linhas(t,cab.cells.length);
    var e=est(t.dataset.cfxK||chave(t,cab));
    var vis=0;
    for(var i=0;i<rs.length;i++){
      var ok=passa(e,rs[i],cab,null);
      rs[i].classList.toggle('cfx-hide',!ok);
      if(ok) vis++;
    }
    if(e.sort){
      var i2=e.sort.i, dir=e.sort.dir, tp=e.sort.tp||'txt';
      var arr=rs.slice();
      arr.forEach(function(r,n){ r._cfxN=n; });
      arr.sort(function(a,b){
        var va=txt(a.cells[i2]), vb=txt(b.cells[i2]), c;
        if(tp==='txt'){ c=va.localeCompare(vb,'pt-BR',{numeric:true,sensitivity:'base'}); }
        else{
          var xa=valOrd(va,tp), xb=valOrd(vb,tp);
          if(xa==null&&xb==null) c=0; else if(xa==null) c=1; else if(xb==null) c=-1; else c=xa-xb;
        }
        if(c===0) return a._cfxN-b._cfxN;                  // estável
        return dir==='desc'? -c : c;
      });
      var tb=arr.length? arr[0].parentNode : null;
      if(tb){
        proprio++;
        try{ arr.forEach(function(r){ tb.appendChild(r); }); }
        finally{ if(mo) mo.takeRecords(); proprio--; }
      }
    }
    // linha "nada passou"
    var antiga=t.querySelector('tr.cfx-vazio'); if(antiga) antiga.remove();
    if(!vis&&rs.length){
      var tr=document.createElement('tr'); tr.className='cfx-vazio';
      var td=document.createElement('td'); td.colSpan=cab.cells.length;
      td.textContent='Nenhuma linha passa pelos filtros desta tela.';
      tr.appendChild(td); (rs[0].parentNode||t.tBodies[0]).appendChild(tr);
    }
    marcarCab(t,cab,e);
    barra(t,e,cab,vis,rs.length);
    t._cfxSig=assinatura(t,cab);
  }

  function assinatura(t,cab){
    var rs=linhas(t,cab.cells.length);
    return rs.length+'/'+(t.tBodies[0]?t.tBodies[0].childElementCount:0)+'/'+(rs[0]?txt(rs[0].cells[0]).length:0);
  }
  function marcarCab(t,cab,e){
    for(var i=0;i<cab.cells.length;i++){
      var b=cab.cells[i].querySelector('.cfx-b'); if(!b) continue;
      var f=e.f[i], so=e.sort&&e.sort.i===i;
      b.classList.toggle('cfx-act',!!f||!!so);
      b.textContent = f? '▼' : (so? (e.sort.dir==='desc'?'↓':'↑') : '▾');
    }
  }
  function rotulo(cab,i){ var s=txt(cab.cells[i]).replace('▾','').replace('▼','').replace('↑','').replace('↓','').trim(); return s||('coluna '+(i+1)); }

  function barra(t,e,cab,vis,tot){
    var bar=t._cfxBar; if(!bar||!bar.parentNode) return;
    var chips=[], n=0;
    for(var k in e.f){
      n++;
      var f=e.f[k], d='';
      if(f.tipo==='vals') d=Object.keys(f.set).length===1? Object.keys(f.set)[0] : (Object.keys(f.set).length+' valores');
      else if(f.tipo==='fx') d=(f.min!=null?f.min:'')+'…'+(f.max!=null?f.max:'');
      else d='contém "'+f.q+'"';
      chips.push('<span class="cfx-chip"><span>'+esc(rotulo(cab,+k))+': '+esc(d)+'</span><button type="button" title="tirar este filtro" data-cfx-x="'+k+'">✕</button></span>');
    }
    if(!n&&!e.sort){ bar.className='cfx-bar'; bar.innerHTML=''; return; }
    bar.className='cfx-bar cfx-on';
    bar.innerHTML='🔎 <b>'+vis+'</b> de <b>'+tot+'</b> '+(tot===1?'linha':'linhas')+
      (e.sort? ' · ordenado por <b>'+esc(rotulo(cab,e.sort.i))+'</b> '+(e.sort.dir==='desc'?'↓':'↑'):'')+
      (chips.length? ' · '+chips.join(' ') : '')+
      ' <button type="button" class="cfx-clr" data-cfx-clr="1">limpar tudo</button>';
    bar.onclick=function(ev){
      var x=ev.target.closest&&ev.target.closest('[data-cfx-x]');
      if(x){ delete e.f[x.getAttribute('data-cfx-x')]; aplicar(t); return; }
      if(ev.target.closest&&ev.target.closest('[data-cfx-clr]')){ e.f={}; e.sort=null; aplicar(t); }
    };
  }

  // ── menu ──
  function fechar(){ if(menu) menu.className='cfx-menu'; mAlvo=null; mCol=-1; mBusca=''; }
  function abrir(t,i,btn){
    tokens();
    if(!menu){
      menu=document.createElement('div'); menu.className='cfx-menu';
      document.body.appendChild(menu);
      menu.addEventListener('click',function(ev){ ev.stopPropagation(); });
    }
    if(mAlvo===t&&mCol===i&&menu.classList.contains('cfx-on')){ fechar(); return; }
    mAlvo=t; mCol=i; mBusca='';
    pintarMenu();
    menu.className='cfx-menu cfx-on';
    var r=btn.getBoundingClientRect();
    var w=menu.offsetWidth||262, h=menu.offsetHeight||300;
    var L=Math.max(6,Math.min(r.left, (window.innerWidth||800)-w-6));
    var T=r.bottom+4;
    if(T+h>(window.innerHeight||600)-6) T=Math.max(6,r.top-h-4);
    menu.style.left=L+'px'; menu.style.top=T+'px';
    var bu=menu.querySelector('[data-cfx-q]'); if(bu) try{bu.focus();}catch(e){}
  }

  function pintarMenu(){
    var t=mAlvo, i=mCol; if(!t||i<0) return;
    var cab=cabecalho(t); if(!cab) return;
    var rs=linhas(t,cab.cells.length);
    var e=est(t.dataset.cfxK||chave(t,cab));
    var tp=tipoCol(rs,i);
    var f=e.f[i];
    // contagem estilo Excel: conta o que passa pelos filtros DAS OUTRAS colunas
    var cont={}, ordem=[];
    for(var k=0;k<rs.length;k++){
      if(!passa(e,rs[k],cab,i)) continue;
      var v=txt(rs[k].cells[i]);
      if(cont[v]==null){ cont[v]=0; ordem.push(v); }
      cont[v]++;
    }
    if(tp==='data') ordem.sort(function(a,b){ var A=dataBR(a),B=dataBR(b); return (A==null?1:B==null?-1:(A<B?-1:A>B?1:0)); });
    else if(tp==='num') ordem.sort(function(a,b){ var A=numDe(a),B=numDe(b); return (A==null?1:B==null?-1:A-B); });
    else ordem.sort(function(a,b){ return String(a).localeCompare(String(b),'pt-BR',{numeric:true,sensitivity:'base'}); });

    var q=norm(mBusca);
    var mostra=q? ordem.filter(function(v){ return norm(v).indexOf(q)>=0; }) : ordem;
    var corte=mostra.length>MAX_VALORES;
    if(corte) mostra=mostra.slice(0,MAX_VALORES);
    var sel=(f&&f.tipo==='vals')? f.set : null;
    var todos=mostra.length&&mostra.every(function(v){ return !sel||sel[v]; });

    var h='';
    h+='<div class="cfx-h" title="'+esc(rotulo(cab,i))+'">'+esc(rotulo(cab,i))+'</div>';
    h+='<div class="cfx-row">'+
       '<button type="button" data-cfx-s="asc"'+(e.sort&&e.sort.i===i&&e.sort.dir==='asc'?' class="cfx-cur"':'')+'>'+(tp==='txt'?'↑ A→Z':'↑ menor')+'</button>'+
       '<button type="button" data-cfx-s="desc"'+(e.sort&&e.sort.i===i&&e.sort.dir==='desc'?' class="cfx-cur"':'')+'>'+(tp==='txt'?'↓ Z→A':'↓ maior')+'</button>'+
       '</div>';
    if(tp!=='txt'){
      var fx=(f&&f.tipo==='fx')?f:{};
      var ph=tp==='data'?'dd/mm/aaaa':'nº';
      h+='<div class="cfx-rg"><span>DE</span><input data-cfx-min value="'+esc(fx.minTxt||'')+'" placeholder="'+ph+'" '+
         'readonly onfocus="this.removeAttribute(\'readonly\')" autocomplete="off" name="cfxmin_nofill" data-lpignore="true" data-1p-ignore>'+
         '<span>ATÉ</span><input data-cfx-max value="'+esc(fx.maxTxt||'')+'" placeholder="'+ph+'" '+
         'readonly onfocus="this.removeAttribute(\'readonly\')" autocomplete="off" name="cfxmax_nofill" data-lpignore="true" data-1p-ignore></div>';
    }
    h+='<div class="cfx-row" style="border-bottom:none;padding-bottom:4px"><input data-cfx-q value="'+esc(mBusca)+'" placeholder="buscar valor nesta coluna" '+
       'readonly onfocus="this.removeAttribute(\'readonly\')" autocomplete="off" name="cfxq_nofill" data-lpignore="true" data-1p-ignore></div>';
    h+='<div class="cfx-list">';
    h+='<label class="cfx-it cfx-all"><input type="checkbox" data-cfx-todos'+(todos?' checked':'')+'><span class="cfx-v">(Selecionar tudo)</span><b class="cfx-n">'+mostra.length+'</b></label>';
    for(var n=0;n<mostra.length;n++){
      var v=mostra[n];
      h+='<label class="cfx-it"><input type="checkbox" data-cfx-v="'+esc(v)+'"'+((!sel||sel[v])?' checked':'')+'>'+
         '<span class="cfx-v" title="'+esc(v)+'">'+esc(v===''?'(vazio)':v)+'</span><b class="cfx-n">'+cont[v]+'</b></label>';
    }
    if(corte) h+='<div class="cfx-it" style="cursor:default;color:var(--cfx-mut)">…só os '+MAX_VALORES+' primeiros. Use a busca acima.</div>';
    h+='</div>';
    h+='<div class="cfx-foot"><button type="button" data-cfx-lim>Limpar coluna</button><button type="button" class="cfx-pri" data-cfx-ok>Fechar</button></div>';
    menu.innerHTML=h;

    menu.querySelectorAll('[data-cfx-s]').forEach(function(b){
      b.onclick=function(){
        var dir=b.getAttribute('data-cfx-s');
        if(e.sort&&e.sort.i===i&&e.sort.dir===dir) e.sort=null; else e.sort={i:i,dir:dir,tp:tp};
        aplicar(t); pintarMenu();
      };
    });
    var qi=menu.querySelector('[data-cfx-q]');
    if(qi) qi.oninput=function(){ mBusca=qi.value; var p=qi.selectionStart; pintarMenu(); var n2=menu.querySelector('[data-cfx-q]'); if(n2){ n2.focus(); try{n2.setSelectionRange(p,p);}catch(_){} } };
    var lo=menu.querySelector('[data-cfx-min]'), hi=menu.querySelector('[data-cfx-max]');
    function faixa(){
      var a=lo?lo.value.trim():'', b=hi?hi.value.trim():'';
      if(!a&&!b){ delete e.f[i]; }
      else e.f[i]={tipo:'fx',cmp:tp,minTxt:a,maxTxt:b,min:a?valOrd(a,tp):null,max:b?valOrd(b,tp):null};
      aplicar(t);
    }
    if(lo){ lo.onchange=faixa; lo.oninput=faixa; }
    if(hi){ hi.onchange=faixa; hi.oninput=faixa; }
    var tds=menu.querySelector('[data-cfx-todos]');
    if(tds) tds.onchange=function(){
      if(tds.checked){ delete e.f[i]; }
      else { var s={}; e.f[i]={tipo:'vals',set:s}; }                 // desmarcar tudo = nada passa
      aplicar(t); pintarMenu();
    };
    menu.querySelectorAll('[data-cfx-v]').forEach(function(cb){
      cb.onchange=function(){
        var atual=(e.f[i]&&e.f[i].tipo==='vals')? e.f[i].set : null;
        var s={};
        if(atual) for(var kk in atual) s[kk]=1;
        else ordem.forEach(function(v){ s[v]=1; });                  // primeiro clique parte de "todos"
        var v=cb.getAttribute('data-cfx-v');
        if(cb.checked) s[v]=1; else delete s[v];
        var faltam=ordem.some(function(v2){ return !s[v2]; });
        if(!faltam) delete e.f[i]; else e.f[i]={tipo:'vals',set:s};
        aplicar(t); pintarMenu();
      };
    });
    var lim=menu.querySelector('[data-cfx-lim]');
    if(lim) lim.onclick=function(){ delete e.f[i]; if(e.sort&&e.sort.i===i) e.sort=null; aplicar(t); pintarMenu(); };
    var ok=menu.querySelector('[data-cfx-ok]');
    if(ok) ok.onclick=fechar;
  }

  // ── varredura: acopla tabela nova, reaplica estado após re-render ──
  function varrer(){
    try{
      proprio++;
      tokens();
      var todas=document.querySelectorAll('table');
      for(var i=0;i<todas.length;i++){
        var t=todas[i];
        if(!t.dataset.cfx){ acoplar(t); continue; }
        if(t.dataset.cfx!=='on') continue;
        var cab=cabecalho(t); if(!cab) continue;
        if(!t._cfxBar||!t._cfxBar.parentNode||t._cfxBar.nextSibling!==t) barraDaTabela(t,t.dataset.cfxK||chave(t,cab));
        if(assinatura(t,cab)!==t._cfxSig){
          menusDaTabela(t,cab,linhas(t,cab.cells.length));
          aplicar(t);
        }
      }
    }catch(e){ try{console.error('[CFX] varredura',e);}catch(_){} }
    finally{ if(mo) mo.takeRecords(); proprio--; }
  }
  function agenda(){ clearTimeout(timer); timer=setTimeout(varrer,160); }

  function iniciar(){
    tokens();
    varrer();
    try{
      mo=new MutationObserver(function(){ if(proprio>0) return; agenda(); });
      mo.observe(document.documentElement,{childList:true,subtree:true});
    }catch(e){}
    document.addEventListener('click',function(ev){
      if(menu&&menu.classList.contains('cfx-on')&&!menu.contains(ev.target)&&!(ev.target.closest&&ev.target.closest('.cfx-b'))) fechar();
    },true);
    document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') fechar(); });
    window.addEventListener('resize',fechar);
  }

  window.CFX={
    versao:VER,
    varrer:varrer,
    limpar:function(sel){ var t=typeof sel==='string'?document.querySelector(sel):sel; if(!t) return; var e=est(t.dataset.cfxK||''); e.f={}; e.sort=null; aplicar(t); },
    desligar:function(sel){ var t=typeof sel==='string'?document.querySelector(sel):sel; if(t) t.setAttribute('data-cfx-off',''); },
    estado:function(){ return S; },
    diag:function(){
      var o={versao:VER,tabelas:[]};
      document.querySelectorAll('table').forEach(function(t){
        o.tabelas.push({cfx:t.dataset.cfx||'(nao avaliada)',chave:t.dataset.cfxK||'',menus:t.querySelectorAll('.cfx-b').length,linhas:(t.tBodies[0]?t.tBodies[0].rows.length:0)});
      });
      return o;
    }
  };

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',iniciar);
  else iniciar();
}catch(e){ try{ console.error('[CFX] nao iniciou; tabelas seguem sem filtro',e); }catch(_){} }
})();
</script>
