  Página NOVA e separada do PCM (não toca no index.html de 5,8 MB). Fala só com as funções fin_* do Supabase
  (FINANCEIRO_BASE + FINANCEIRO_CADASTROS) usando o crachá do login com PIN (proper_session.supa_token).
  Só Financeiro e administrador enxergam: quem não pode recebe a frase do banco, não uma tela vazia.
  🔴 NÃO PUBLICAR antes das auditorias (nível 3, dinheiro) e antes de os dois SQL rodarem no Supabase.

<style>

@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--bg:#10141c;--card:#181e29;--tx:#e8ecf3;--mut:#9aa5b8;--bd:#2c3546;--pri:#6ea0ff;--pri-tx:#08101f;--ok:#58d49a;--okbg:#12301f;--ruim:#ff8f84;--ruimbg:#3a1714;--av:#f2c15b;--avbg:#3a2c0b;--cinza:#222a38}}

<body>
<header>
  <h1>💰 Financeiro</h1>
  <nav id="nav" aria-label="Seções"></nav>
  <span class="quem" id="quem"></span>
</header>
<main id="main"><div class="vazio">Carregando…</div></main>
<div id="toast" aria-live="polite"></div>

<script>
/* leitor_xml_fiscal.js — ProperCare · financeiro_base (11/10/2026)
 * Lê o XML de NF-e (modelo 55, procNFe), o evento de cancelamento (procEventoNFe 110111) e a NFS-e do
 * padrão nacional (NFSe 1.01 / distribuição) e devolve um objeto NORMALIZADO, sem dependência (serve no
 * navegador, no Deno da Edge Function e no Node). NÃO grava nada: quem grava é o SQL (fin_nota_importar).
 *   const r = PCFiscal.ler(textoXml);   // { ok, tipo, ..., avisos:[], erros:[] }
 * Regras: dinheiro sai como NÚMERO com a precisão do XML (preço unitário tem até 6 casas); a conferência de
 * soma usa CENTAVOS INTEIROS (nunca ponto flutuante direto); o que não bate vira aviso/erro, nunca é "arrumado".
 */
(function (raiz) {
  'use strict';

  // ── 1 · mini leitor de XML (nomes sem prefixo de namespace) ─────────────────────────────────────────
  function lerXml(s) {
    if (typeof s !== 'string') throw new Error('XML: esperava texto');
    s = s.replace(/^﻿/, '');
    var i = 0, n = s.length, raiz = { n: '#raiz', a: {}, c: [], t: '' }, pilha = [raiz];
    function decod(t) {
      return t.replace(/&(#x[0-9a-fA-F]+|#\d+|lt|gt|amp|quot|apos);/g, function (m, e) {
        if (e === 'lt') return '<'; if (e === 'gt') return '>'; if (e === 'amp') return '&';
        if (e === 'quot') return '"'; if (e === 'apos') return "'";
        var cp = e[1] === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        return cp >= 0 && cp <= 0x10FFFF ? String.fromCodePoint(cp) : m;
      });
    }
    while (i < n) {
      var lt = s.indexOf('<', i);
      if (lt < 0) { var resto = s.slice(i).trim(); if (resto) throw new Error('XML: texto solto depois do fim'); break; }
      if (lt > i) { var tx = s.slice(i, lt); if (tx.trim()) pilha[pilha.length - 1].t += decod(tx); }
      if (s.startsWith('<!--', lt)) { var f = s.indexOf('-->', lt + 4); if (f < 0) throw new Error('XML: comentário aberto'); i = f + 3; continue; }
      if (s.startsWith('<![CDATA[', lt)) { var f2 = s.indexOf(']]>', lt + 9); if (f2 < 0) throw new Error('XML: CDATA aberto'); pilha[pilha.length - 1].t += s.slice(lt + 9, f2); i = f2 + 3; continue; }
      if (s.startsWith('<?', lt)) { var f3 = s.indexOf('?>', lt + 2); if (f3 < 0) throw new Error('XML: instrução aberta'); i = f3 + 2; continue; }
      if (s.startsWith('<!', lt)) { var f4 = s.indexOf('>', lt + 2); if (f4 < 0) throw new Error('XML: declaração aberta'); i = f4 + 1; continue; }
      var gt = lt + 1, asp = null;                       // acha o '>' que fecha a marca, respeitando aspas dos atributos
      while (gt < n) { var ch = s[gt]; if (asp) { if (ch === asp) asp = null; } else if (ch === '"' || ch === "'") asp = ch; else if (ch === '>') break; gt++; }
      if (gt >= n) throw new Error('XML: marca sem fim');
      var tag = s.slice(lt + 1, gt);
      if (tag[0] === '/') {
        var nomeF = tag.slice(1).trim().replace(/^.*:/, '');
        var topo = pilha.pop();
        if (!topo || topo.n !== nomeF) throw new Error('XML: </' + nomeF + '> não fecha <' + (topo && topo.n) + '>');
      } else {
        var vazio = tag.endsWith('/'); if (vazio) tag = tag.slice(0, -1);
        var m = /^([^\s/>]+)([\s\S]*)$/.exec(tag); if (!m) throw new Error('XML: marca vazia');
        var no = { n: m[1].replace(/^.*:/, ''), a: {}, c: [], t: '' };
        var re = /([^\s=]+)\s*=\s*("([^"]*)"|'([^']*)')/g, am;
        while ((am = re.exec(m[2]))) { var nomeA = am[1].replace(/^.*:/, ''); if (am[1].indexOf('xmlns') !== 0) no.a[nomeA] = decod(am[3] !== undefined ? am[3] : am[4]); }
        pilha[pilha.length - 1].c.push(no);
        if (!vazio) pilha.push(no);
      }
      i = gt + 1;
    }
    if (pilha.length !== 1) throw new Error('XML: <' + pilha[pilha.length - 1].n + '> sem fechamento');
    if (!raiz.c.length) throw new Error('XML vazio');
    return raiz.c[0];
  }

  // ── 2 · acesso por caminho ───────────────────────────────────────────────────────────────────────────
  function filho(no, nome) { if (!no) return null; for (var k = 0; k < no.c.length; k++) if (no.c[k].n === nome) return no.c[k]; return null; }
  function filhos(no, nome) { return no ? no.c.filter(function (x) { return x.n === nome; }) : []; }
  function cam(no, caminho) { var p = caminho.split('/'), a = no; for (var k = 0; k < p.length && a; k++) a = filho(a, p[k]); return a; }
  function txt(no, caminho) { var a = caminho ? cam(no, caminho) : no; return a ? a.t.trim() : ''; }
  function ach(no, nome) {                              // 1ª ocorrência em qualquer profundidade
    if (!no) return null; if (no.n === nome) return no;
    for (var k = 0; k < no.c.length; k++) { var r = ach(no.c[k], nome); if (r) return r; } return null;
  }
  function num(v) { if (v === '' || v == null) return null; var x = Number(v); return isFinite(x) ? x : null; }
  function cent(x) { return x == null ? null : Math.round(x * 100); }
  function soDig(v) { return String(v || '').replace(/\D+/g, ''); }

  // ── 3 · NF-e (procNFe) ───────────────────────────────────────────────────────────────────────────────
  function lerNfe(raizNo) {
    var av = [], er = [];
    var nfe = raizNo.n === 'NFe' ? raizNo : cam(raizNo, 'NFe'), inf = filho(nfe, 'infNFe');
    if (!inf) throw new Error('NF-e sem infNFe');
    var prot = cam(raizNo, 'protNFe/infProt');
    var chave = soDig(inf.a.Id || '').slice(-44);
    if (chave.length !== 44) er.push('chave de acesso inválida no Id (' + (inf.a.Id || '') + ')');
    if (prot && txt(prot, 'chNFe') && soDig(txt(prot, 'chNFe')) !== chave) er.push('chave do protocolo difere da chave da nota');
    var ide = filho(inf, 'ide'), emit = filho(inf, 'emit'), dest = filho(inf, 'dest');
    var cStat = prot ? txt(prot, 'cStat') : '';
    var status = !prot ? 'sem_protocolo' : (cStat === '100' || cStat === '150') ? 'autorizada' : (cStat === '101' || cStat === '135' || cStat === '151') ? 'cancelada' : 'rejeitada';
    if (!prot) av.push('XML sem protocolo de autorização (não é procNFe): não vale como nota autorizada');
    var itens = filhos(inf, 'det').map(function (d) {
      var p = filho(d, 'prod'), im = cam(d, 'imposto/ICMS'), g = im && im.c[0];     // ICMSSN102, ICMS00…
      var orig = g ? txt(g, 'orig') : '', csosn = g ? (txt(g, 'CSOSN') || txt(g, 'CST')) : '';
      return {
        n: Number(d.a.nItem), codigo: txt(p, 'cProd'), descricao: txt(p, 'xProd'), ncm: txt(p, 'NCM'), cest: txt(p, 'CEST') || null,
        cfop: txt(p, 'CFOP'), un: txt(p, 'uCom'), qtd: num(txt(p, 'qCom')), valor_unit: num(txt(p, 'vUnCom')), valor_total: num(txt(p, 'vProd')),
        desconto: num(txt(p, 'vDesc')) || 0, frete: num(txt(p, 'vFrete')) || 0, origem: orig || null, csosn_cst: csosn || null,
        regime_icms: g ? g.n : null
      };
    });
    var tot = cam(inf, 'total/ICMSTot');
    var totais = tot ? { produtos: num(txt(tot, 'vProd')), frete: num(txt(tot, 'vFrete')) || 0, desconto: num(txt(tot, 'vDesc')) || 0,
                         outras: num(txt(tot, 'vOutro')) || 0, icms: num(txt(tot, 'vICMS')) || 0, nota: num(txt(tot, 'vNF')),
                         seguro: num(txt(tot, 'vSeg')) || 0, ii: num(txt(tot, 'vII')) || 0, ipi: num(txt(tot, 'vIPI')) || 0, ipi_devol: num(txt(tot, 'vIPIDevol')) || 0,
                         st: num(txt(tot, 'vST')) || 0, fcp_st: num(txt(tot, 'vFCPST')) || 0, icms_deson: num(txt(tot, 'vICMSDeson')) || 0 } : null;
    var parcelas = filhos(filho(inf, 'cobr'), 'dup').map(function (d, k) {
      return { numero: txt(d, 'nDup') || String(k + 1).padStart(3, '0'), vencimento: txt(d, 'dVenc') || null, valor: num(txt(d, 'vDup')) };
    });
    var pgto = filhos(filho(inf, 'pag'), 'detPag').map(function (d) { return { forma: txt(d, 'tPag'), valor: num(txt(d, 'vPag')) }; });
    var infCpl = txt(inf, 'infAdic/infCpl');
    var oc = /Orde?m?\s+de\s+Compra\s*:?\s*([A-Za-z0-9./-]+)/i.exec(infCpl);
    var tpNF = txt(ide, 'tpNF');
    var r = {
      ok: false, tipo: 'nfe', modelo: txt(ide, 'mod'), serie: txt(ide, 'serie'), numero: Number(txt(ide, 'nNF')), chave: chave,
      protocolo: prot ? txt(prot, 'nProt') : null, status: status, cstat: cStat || null, ambiente: txt(ide, 'tpAmb') === '1' ? 'producao' : 'homologacao',
      tp_nf: tpNF, direcao_xml: tpNF === '0' ? 'entrada' : 'saida', natureza: txt(ide, 'natOp'), finalidade: txt(ide, 'finNFe'),     // a DIREÇÃO (entrada/saída) quem decide é o banco, pelo CNPJ da empresa — nunca só o tpNF
      emitida_em: txt(ide, 'dhEmi') || null, saida_em: txt(ide, 'dhSaiEnt') || null,
      emitente: { cnpj: soDig(txt(emit, 'CNPJ') || txt(emit, 'CPF')), nome: txt(emit, 'xNome'), ie: txt(emit, 'IE') || null, crt: txt(emit, 'CRT') || null,
                  uf: txt(emit, 'enderEmit/UF') || null },
      parte: dest ? { cnpj: soDig(txt(dest, 'CNPJ') || txt(dest, 'CPF')), nome: txt(dest, 'xNome'), ie: txt(dest, 'IE') || null,
                      uf: txt(dest, 'enderDest/UF') || null, municipio: txt(dest, 'enderDest/xMun') || null, email: txt(dest, 'email') || null } : null,
      itens: itens, totais: totais, frete_modalidade: txt(inf, 'transp/modFrete') || null, parcelas: parcelas, pagamentos: pgto,
      info_complementar: infCpl || null, pedido_cliente: oc ? oc[1] : null, avisos: av, erros: er
    };
    // conferências (centavos inteiros)
    var somaIt = itens.reduce(function (a, x) { return a + (cent(x.valor_total) || 0); }, 0);
    if (totais && cent(totais.produtos) !== somaIt) er.push('soma dos itens (' + somaIt / 100 + ') ≠ valor dos produtos (' + totais.produtos + ')');
    // coerência interna: o digVal do protocolo da SEFAZ tem de ser igual ao DigestValue da assinatura (os dois vêm do MESMO arquivo; ninguém recalcula o hash). Isto pega arquivo incompleto ou misturado, NÃO pega XML adulterado. A assinatura RSA NÃO é verificada.
    var dv = ach(raizNo, 'DigestValue'), pv = prot ? txt(prot, 'digVal') : '';
    r.dig_val = { assinatura: dv ? dv.t.trim() : null, protocolo: pv || null, confere: !!(dv && pv && dv.t.trim() === pv) };
    if (prot && !r.dig_val.confere) er.push('digVal do protocolo ≠ DigestValue da assinatura (arquivo inconsistente — isto não prova autenticidade)');
    if (totais) {
      // fórmula completa do vNF (NT 2013/005): produtos − desconto − ICMS desonerado + ST + FCP ST + frete + seguro + outras + II + IPI + IPI devolvido
      var esperado = cent(totais.produtos) - cent(totais.desconto) - cent(totais.icms_deson) + cent(totais.st) + cent(totais.fcp_st) + cent(totais.frete) + cent(totais.seguro)
                   + cent(totais.outras) + cent(totais.ii) + cent(totais.ipi) + cent(totais.ipi_devol);
      if (esperado !== cent(totais.nota)) er.push('vNF (' + totais.nota + ') não fecha com a fórmula da NF-e (' + esperado / 100 + ')');
      if (parcelas.length) {
        var somaP = parcelas.reduce(function (a, x) { return a + (cent(x.valor) || 0); }, 0);
        if (somaP !== cent(totais.nota)) er.push('soma das parcelas (' + somaP / 100 + ') ≠ valor da nota (' + totais.nota + ')');
      }
    } else er.push('nota sem total (ICMSTot)');
    if (!itens.length) er.push('nota sem itens');
    if (r.ambiente !== 'producao') av.push('nota de HOMOLOGAÇÃO: não vale como nota real');
    r.ok = er.length === 0; return r;
  }

  // ── 4 · evento (cancelamento) ────────────────────────────────────────────────────────────────────────
  function lerEvento(raizNo) {
    var evn = filho(raizNo, 'evento'), ev = (evn && filho(evn, 'infEvento')) || ach(raizNo, 'infEvento'), ret = filho(raizNo, 'retEvento'), ri = ret && filho(ret, 'infEvento'), er = [];
    var tp = txt(ev, 'tpEvento'), det = filho(ev, 'detEvento');
    var cs = ri ? txt(ri, 'cStat') : '';
    var chv = soDig(txt(ev, 'chNFe')), chr = ri ? soDig(txt(ri, 'chNFe')) : '', tpr = ri ? txt(ri, 'tpEvento') : '';
    // homologado = a SEFAZ devolveu 135 (evento registrado) ou 155 (cancelamento fora de prazo) PARA ESTA chave e PARA ESTE tipo de evento (136 = registrado sem vincular à nota: não vale)
    var r = { ok: false, tipo: 'evento', evento: tp, descricao: txt(det, 'descEvento'), chave: chv, protocolo: ri ? txt(ri, 'nProt') : txt(det, 'nProt'),
              justificativa: txt(det, 'xJust') || null, quando: txt(ev, 'dhEvento') || null, cstat: cs || null, ret_chave: chr || null, ret_evento: tpr || null,
              homologado: !!ri && (cs === '135' || cs === '155') && chr === chv && tpr === tp && tp === '110111', avisos: [], erros: er };
    if (r.chave.length !== 44) er.push('evento com chave inválida');
    if (!ri) r.avisos.push('evento sem retorno da SEFAZ (retEvento): não vale como homologado');

  // ── subir o OFX ──

    var r = PCOfx.lerBytes(buf), h = null; try { h = await PCOfx.hash(buf); } catch (e) {}

  function cxPrevia(nome, r, hash) {

      html += '<div class="f2" style="margin-bottom:8px">' + cel('Banco / conta', (r.banco_id || '?') + ' / ' + (r.conta_banco || '?')) + cel('Período', dBR(r.periodo_de) + ' a ' + dBR(r.periodo_ate)) + cel('Linhas', String(rs.linhas)) +
        cel('Entradas', brl(rs.entradas)) + cel('Saídas', brl(rs.saidas)) + cel('Movimento do período', brl(rs.saldo_do_periodo)) + '</div>' +
        '<div class="tw"><table><thead><tr><th>Data</th><th>Texto</th><th class="n">Valor</th></tr></thead><tbody>' + r.linhas.slice(0, 8).map(function (l) { return '<tr><td>' + esc(dBR(l.data)) + '</td><td>' + esc(l.memo || '') + '</td><td class="n">' + brl(l.valor) + '</td></tr>'; }).join('') + '</tbody></table></div>' +

      itens.push({ recorrencia_id: x.id, valor: t, vencimento: vn });

    if (erro) { msg.innerHTML = '<div class="erro">' + esc(erro) + '</div>'; return; }
    if (!itens.length) { msg.innerHTML = '<div class="erro">Marque ao menos uma recorrência.</div>'; return; }
    return acao(b, async function () {
      var r = await rpcJ('fin_recorrencia_gerar', { mes: S.recMes + '-01', itens: itens }, { escrita: true });
      toast(r.criados + ' título(s) gerado(s)' + (r.repetidos ? ' · ' + r.repetidos + ' já existia(m)' : '') + '.'); await telaRecorrencias();
    }, function (m) { msg.innerHTML = '<div class="erro">' + esc(m) + '</div>'; });
  }
  function formRec(id) {
    var x = id ? S.rec.filter(function (y) { return y.id === id; })[0] : null; if (id && !x) return;
    x = x || { descricao: '', tipo: 'pagar', parte_nome: '', parte_doc: '', categoria_id: '', conta_id: '', regra: 'dia_mes', dia: 10, competencia: 'mesmo', valor_ref: null, inicio: hoje().slice(0, 7) + '-01', fim: '', ativa: true, observacao: '' };
    var j = janela(id ? 'Editar recorrência' : 'Nova recorrência',
      '<form autocomplete="off"><div class="f2"><label class="c">Descrição<input name="descricao" required maxlength="80" value="' + esc(x.descricao) + '"></label>' +
      '<label class="c">Tipo<select name="tipo"><option value="pagar"' + (x.tipo === 'pagar' ? ' selected' : '') + '>a pagar</option><option value="receber"' + (x.tipo === 'receber' ? ' selected' : '') + '>a receber</option></select></label>' +
      '<label class="c">Fornecedor / cliente<input name="parte" required maxlength="120" value="' + esc(x.parte_nome) + '"></label>' +
      '<label class="c">Categoria<select name="cat"></select></label>' +
      '<label class="c">Conta (opcional)<select name="conta">' + optsContas(x.conta_id || '', true) + '</select></label>' +
      '<label class="c">Vence<select name="regra"><option value="dia_mes"' + (x.regra === 'dia_mes' ? ' selected' : '') + '>no dia do mês</option><option value="dia_util"' + (x.regra === 'dia_util' ? ' selected' : '') + '>no N-ésimo dia útil (bancário)</option><option value="dia_util_sab"' + (x.regra === 'dia_util_sab' ? ' selected' : '') + '>no N-ésimo dia útil da CLT (salário: sábado conta)</option></select></label>' +
      '<label class="c">Se cair em sábado, domingo ou feriado<select name="ajuste"><option value="manter"' + ((x.ajuste || 'manter') === 'manter' ? ' selected' : '') + '>manter o dia</option><option value="antecipar"' + (x.ajuste === 'antecipar' ? ' selected' : '') + '>antecipar (ex.: FGTS, GPS)</option><option value="prorrogar"' + (x.ajuste === 'prorrogar' ? ' selected' : '') + '>prorrogar (ex.: DAS)</option></select></label>' +
      '<label class="c">Dia<input name="dia" required inputmode="numeric" maxlength="2" value="' + esc(x.dia) + '"></label>' +
      '<label class="c">Nome do título gerado<select name="comp"><option value="mesmo"' + (x.competencia !== 'anterior' ? ' selected' : '') + '>pelo mês (ex.: Aluguel 11/2026)</option><option value="anterior"' + (x.competencia === 'anterior' ? ' selected' : '') + '>pela competência do mês anterior (ex.: FGTS – Competência 10/2026 – Vencimento 11/2026)</option></select></label>' +
      '<label class="c">Valor de referência (R$, opcional)<input name="valor" inputmode="decimal" placeholder="muda todo mês? deixe vazio" value="' + (x.valor_ref == null ? '' : c2(x.valor_ref)) + '"></label>' +
      '<label class="c">Começa em<input name="ini" type="month" required value="' + esc(String(x.inicio).slice(0, 7)) + '"></label>' +
      '<label class="c">Termina em (opcional)<input name="fim" type="month" value="' + esc(x.fim ? String(x.fim).slice(0, 7) : '') + '"></label>' +
      (id ? '<label><input type="checkbox" name="ativa"' + (x.ativa ? ' checked' : '') + '> ativa</label>' : '') +
      '<label class="c todo">Observação<input name="obs" maxlength="300" value="' + esc(x.observacao || '') + '"></label></div>' +
      '<p class="mut">Recorrência não se apaga: para parar, desmarque “ativa” ou defina o mês de término. Mudar aqui vale só para os meses ainda não gerados.</p><div id="msg"></div>' +
      '<div class="rod"><button type="button" class="b" data-act="fechar">Cancelar</button><button class="b pri" type="submit">Salvar</button></div></form>');
    var fm = j.el.querySelector('form');
    function cats() { fm.cat.innerHTML = optsCats(fm.tipo.value === 'pagar' ? 'despesa' : 'receita', x.categoria_id || ''); }
    cats(); fm.tipo.addEventListener('change', function () { x.categoria_id = ''; cats(); });
    function aj() { fm.ajuste.disabled = fm.regra.value !== 'dia_mes'; } aj(); fm.regra.addEventListener('change', aj);
    fm.addEventListener('submit', function (e) {
      e.preventDefault(); var msg = j.el.querySelector('#msg'), vv = fm.valor.value.trim() === '' ? '' : valorTxt(fm.valor.value);
      if (vv === null) { msg.innerHTML = '<div class="erro">Valor de referência inválido (até 2 casas decimais).</div>'; return; }
      acao(fm.querySelector('[type=submit]'), async function () {
        await rpcJ('fin_recorrencia_salvar', { id: id || '', descricao: fm.descricao.value, tipo: fm.tipo.value, parte_nome: fm.parte.value, categoria_id: fm.cat.value, conta_id: fm.conta.value, regra: fm.regra.value, ajuste: fm.ajuste.value, competencia: fm.comp.value, dia: fm.dia.value.trim(), valor_ref: vv,
          inicio: fm.ini.value ? fm.ini.value + '-01' : '', fim: fm.fim.value ? fm.fim.value + '-01' : '', ativa: id ? fm.ativa.checked : true, observacao: fm.obs.value.trim() }, { escrita: true });
        j.fechar(); toast('Recorrência salva.'); await telaRecorrencias();
      }, function (m) { msg.innerHTML = '<div class="erro">' + esc(m) + '</div>'; });
    });
  }

  // ── cliques ─────────────────────────────────────────────────────────────────────────
  var ACT = {
    aba: function (d) { return ir(d.aba); },
    filtrar: function () { return acao(null, function () { return carregarTitulos(S.aba); }); },
    novo: function () { novoLancamento(S.aba); },
    fechar: function (d, b) { var f = b.closest('.fundo'); if (f) fechar(f); },
    detalhe: function (d) { return acao(null, function () { return detalhe(d.id, function () { return recarregar(); }); }); },
    baixar: function (d, b) {
      var antes = b.closest('.fundo'); if (antes) fechar(antes);
      return acao(null, function () { return baixar(d.id, function () { return recarregar(); }); });
    },
    estornar: function (d, b) {
      var base = b.closest('.fundo');
      pedirMotivo('Estornar baixa', 'Motivo do estorno', 'Estornar', async function (m) {
        await rpc('fin_baixa_estornar', { p_baixa: d.id, p_motivo: m }, { escrita: true });
        toast('Baixa estornada.'); if (base) fechar(base); await recarregar();
      });
    },
    cancelar: function (d, b) {
      var base = b.closest('.fundo');
      pedirMotivo('Cancelar título', 'Motivo do cancelamento', 'Cancelar título', async function (m) {
        await rpc('fin_titulo_cancelar', { p_titulo: d.id, p_motivo: m }, { escrita: true });
        toast('Título cancelado.'); if (base) fechar(base); await recarregar();
      });
    },
    periodo: function () {
      var a = $('rDe').value, z = $('rAte').value;
      if (!/^\d{4}-\d{2}$/.test(a) || !/^\d{4}-\d{2}$/.test(z)) { toast('Escolha o mês inicial e o final.'); return; }
      if (a > z) { toast('O mês inicial não pode ser depois do final.'); return; }
      var de = a + '-01', ate = addDias(addMes(z + '-01', 1), -1);
      if (meses(a, z) > 36) { toast('Período grande demais (máximo 36 meses).'); return; }
      S.res = { de: de, ate: ate }; return acao(null, function () { return telaResumo(); });
    },
    desfazer: function (d, b) {
      var base = b.closest('.fundo');
      pedirMotivo('Desfazer transferência', 'Motivo', 'Desfazer', async function (m) {
        await rpc('fin_transferencia_estornar', { p_grupo: d.grupo, p_motivo: m }, { escrita: true });
        toast('Transferência desfeita.'); if (base) fechar(base); await recarregar();
      });
    },
    transferir: function () { formTransferir(); },
    relver: function () {
      var m = $('relMes').value; if (!/^\d{4}-\d{2}$/.test(m)) { toast('Escolha o mês.'); return; }
      return acao(null, function () { return carregarRelatorio(m); });
    },
    relcsv: function () { if (!S.rel) return; baixarTexto('notas-emitidas-' + S.rel.mes + '.csv', csvRelatorio(S.rel), 'text/csv;charset=utf-8'); },
    relcfop: function () { if (!S.rel) return; baixarTexto('faturamento-por-cfop-' + S.rel.mes + '.csv', csvCfop(S.rel), 'text/csv;charset=utf-8'); },
    relimp: function () { window.print(); },
    cxfiltrar: function () { var c = cxEstado(); c.conta = $('cxConta').value; c.status = $('cxSit').value; c.de = $('cxDe').value; c.ate = $('cxAte').value; c.busca = $('cxBusca').value.trim(); return acao(null, carregarConciliacao); },
    cxconf: function (d, b) { return acao(b, function () { return cxConfirmar(d.id, Number(d.i || 0)); }); },
    cxaltas: function (d, b) { return cxAltas(b); },
    cxoutro: function (d) { return acao(null, function () { return cxOutro(d.id); }); },
    cxdesfazer: function (d, b) {
      pedirMotivo('Desfazer conciliação', 'Motivo (as baixas que a conciliação criou serão estornadas; nada é apagado)', 'Desfazer', async function (m) {
        await rpc('fin_conciliacao_desfazer', { p_linha: d.id, p_motivo: m }, { escrita: true });
        toast('Conciliação desfeita.'); await carregarConciliacao();
      });
    },
    cxreabrir: function (d, b) { return acao(b, async function () { await rpc('fin_conciliacao_reabrir', { p_linha: d.id }, { escrita: true }); toast('Linha reaberta.'); await carregarConciliacao(); }); },
    cxbuscar: function (d, b) { return acao(b, function () { return cxBuscar(b.closest('.fundo')); }); },
    cxbaixar: function (d, b) { return cxBaixarSel(b); },
    cxligar: function (d, b) { return cxLigarSel(b); },
    cxdivadd: function (d, b) { var f = b.closest('.fundo'), box = f.querySelector('#cxDivLin'), n = box.querySelectorAll('.cxDP').length; if (n >= 10) return; var t = document.createElement('div'); t.innerHTML = cxDivLinha(Number(f.__linha.valor) < 0, n + 1); box.appendChild(t.firstChild); cxRenumDiv(f); cxSomaD(f); },
    cxdivrem: function (d, b) { var f = b.closest('.fundo'); if (f.querySelectorAll('.cxDP').length <= 2) return; b.closest('.cxDP').remove(); cxRenumDiv(f); cxSomaD(f); },
    cxdividir: function (d, b) { return cxDividir(b); },
    cxlancar: function (d, b) { return cxLancar(b); },
    cxtransf: function (d, b) { return cxTransf(b); },
    cxignorar: function (d, b) { return cxIgnorar(b); },
    cxsug: function (d, b) { var f = b.closest('.fundo'); return acao(b, async function () { await cxConfirmar(d.id, Number(d.i)); if (f) fechar(f); }); },
    cxregras: function () { return acao(null, cxRegras); },
    cxregraoff: function (d, b) { return acao(b, async function () { await rpc('fin_conciliacao_regra_desativar', { p_regra: d.id }, { escrita: true }); toast('Regra desativada.'); var f = b.closest('.fundo'); if (f) fechar(f); await cxRegras(); }); },
    rcver: function () { var m = $('rcMes').value; if (!/^\d{4}-\d{2}$/.test(m)) { toast('Escolha o mês.'); return; } S.recMes = m; return acao(null, carregarMesRec); },
    rcgerar: function (d, b) { return gerarRec(b); },
    rcferliga: function (d, b) { return acao(b, async function () { await rpcJ('fin_feriado_salvar', { data: d.d, ativo: d.a === '1' }, { escrita: true }); toast('Feriado ' + (d.a === '1' ? 'ligado' : 'desligado') + '.'); await carregarFeriados(); await carregarMesRec(); }); },
    rcnova: function () { formRec(''); },
    rcedit: function (d) { formRec(d.id); },
    pvnova: function (d) { formProv('', d.conta); },
    pvedit: function (d) { formProv(d.id); },
    pvinformar: function (d) { formProvInformar(d.conta); },
    pvhist: function (d) { return acao(null, function () { return histProv(d.id); }); },
    periodopadrao: function () { S.res = null; return acao(null, function () { return telaResumo(); }); },
    importar: function (d, b) { return acao(b, function () { return importar(b); }); },
    limparimp: function () { S.imp = []; pintarImp(); },
    conta: function (d) { formConta(d.id); },
    cat: function (d) { formCat(d.id); }
  };
  async function recarregar() {
    if (S.aba === 'receber' || S.aba === 'pagar') await carregarTitulos(S.aba);
    else if (S.aba === 'resumo') await telaResumo();
    else if (S.aba === 'relatorio') await telaRelatorio();
    else if (S.aba === 'conciliacao') await carregarConciliacao();
    else if (S.aba === 'provisoes') await telaProvisoes();
    else if (S.aba === 'recorrencias') await telaRecorrencias();
    else if (S.aba === 'cadastros') await telaCadastros();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.tagName === 'TR' && e.target.closest('button')) return;       // botão dentro da linha: só o botão age
    var f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
  });

  // ── partida ─────────────────────────────────────────────────────────────────────────
  async function iniciar() {
    var s = sessao(), tok = s && s.supa_token;
    if (!tok) { $('main').innerHTML = '<div class="erro"><b>Sem login.</b> Abra o Hub, entre com seu PIN e volte para esta página.</div>'; return; }
    var c = jwt(tok);
    if ((c.exp || 0) < Date.now() / 1000) { $('main').innerHTML = '<div class="erro"><b>O crachá do login venceu.</b> Entre de novo pelo Hub (PIN) e volte aqui.</div>'; return; }
    $('quem').textContent = s.nome_tecnico || (s.tecnico && s.tecnico.nome) || '';
    var h = (location.hash || '').slice(1); S.aba = ABAS.some(function (a) { return a[0] === h; }) ? h : 'resumo';
    await ir(S.aba);
  }
  if (typeof document !== 'undefined') iniciar();
  return { _t: { valorTxt: valorTxt, parcelas: parcelas, centavos: centavos, addDias: addDias, dataValida: dataValida, brl: brl, esc: esc, dBR: dBR } };
})();
</script>
